name: CareerMate regression tests

on:
  push:
    branches:
      - fix/security-hardening-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          FLASK_DEBUG: '0'
          ENABLE_DEMO_DATA: '0'
