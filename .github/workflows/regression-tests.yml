name: CareerMate regression tests

on:
  push:
    branches:
      - fix/security-hardening-20261102
      - feature/postgres-integration-20261102
  pull_request:
    branches:
      - main
      - fix/security-hardening-20261102
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careermate_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: careermate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careermate_test -d careermate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          FLASK_DEBUG: '0'
          ENABLE_DEMO_DATA: '0'
          CAREERMATE_PG_TEST_URL: postgresql://careermate_test:disposable_test_password@127.0.0.1:5432/careermate_test
