name: CareerMate checks
on:
  push:
    branches: [feature/first-login-password-change]
  pull_request:
    branches: [main, feature/student-id-scheme-20261102]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
